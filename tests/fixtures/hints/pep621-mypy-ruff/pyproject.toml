[project]
name = "billing"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic[email]>=2,<3",
    "SQLAlchemy==2.0.30",
    "stripe; python_version >= '3.10'",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pytest"]

[tool.mypy]
strict = true

[tool.ruff]
line-length = 100
