name: release

# A pushed `v*` tag builds the archives and publishes a GitHub Release.
# Running it by hand (workflow_dispatch, only once this file is on the default branch)
# builds, checks and attests the same archives and keeps them as workflow artifacts,
# without creating a release. A pull request that changes this file runs the same dry
# run without the attestation, so the workflow is tested before it lands.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "lagom") | .version')
          [ -n "$crate" ] || { echo "::error::no lagom package in cargo metadata"; exit 1; }
          version=$crate
          if [ "$REF_TYPE" = tag ]; then
            version=${REF_NAME#v}
            # v0.1.0 needs version 0.1.0; a pre-release tag such as v0.1.0-rc.1 may also use it.
            case "$version" in
              "$crate" | "$crate"-*) ;;
              *) echo "::error::tag $REF_NAME does not match Cargo.toml version $crate"; exit 1 ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true }
          # Cross-built: checked by running it under user-mode emulation.
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true, emulator: qemu-aarch64-static }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      ZIG: ${{ matrix.zig && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - name: Install cargo-zigbuild (hash-pinned)
        if: matrix.zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig"
          cat > "$RUNNER_TEMP/zig.txt" <<'EOF'
          cargo-zigbuild==0.23.4 --hash=sha256:0a149a2a07b9513d422efa9cc23e1add9741f08abe86845fa418eaeb4cca7931
          ziglang==0.15.2 --hash=sha256:806316453d1ede7174ed3fefb8e5348154629089c3bb5fe812dfd0e172fac130
          EOF
          "$RUNNER_TEMP/zig/bin/pip" install --only-binary :all: --require-hashes -r "$RUNNER_TEMP/zig.txt"
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo ${ZIG:+zig}build --release --locked --target "$TARGET" --bin lagom
      - name: Check the binary
        env:
          EMULATOR: ${{ matrix.emulator }}
        run: |
          bin="target/$TARGET/release/lagom"
          kind=$(file "$bin") && echo "$kind"
          if [ -n "$EMULATOR" ]; then
            sudo apt-get install -y -qq qemu-user-static > /dev/null
          fi
          out=$(${EMULATOR:+"$EMULATOR"} "$bin" --version) && echo "$out"
          case "$out" in "lagom "*) ;; *) echo "::error::unexpected --version output"; exit 1 ;; esac
          if [ -n "$ZIG" ]; then
            case "$kind" in *"statically linked"* | *"static-pie linked"*) ;; *) echo "::error::not a static binary"; exit 1 ;; esac
          fi
      - name: Package
        env:
          COPYFILE_DISABLE: "1" # no macOS ._ files in the tarball
        run: |
          name="lagom-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/lagom" LICENSE README.md CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          tar -tzf "dist/$name.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/lagom-${{ needs.version.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum lagom-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          [ "$(wc -l < SHA256SUMS)" -eq 4 ] || { echo "::error::expected 4 archives"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request' # no attestations for builds that aren't released
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          section() { awk -v h="## [$1]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on && (NF || seen) { print; seen = 1 }' CHANGELOG.md; }
          body=$(section "$VERSION")
          if [ -z "$body" ] && [ "$VERSION" != "${VERSION%%-*}" ]; then
            body=$(section "${VERSION%%-*}")
            [ -n "$body" ] || body="Pre-release build of lagom $VERSION."
          fi
          [ -n "$body" ] || { echo "::error::CHANGELOG.md has no [$VERSION] section"; exit 1; }
          {
            printf '%s\n\n' "$body"
            echo "### Verify"
            echo '```sh'
            echo 'sha256sum -c SHA256SUMS --ignore-missing   # macOS: shasum -a 256 -c SHA256SUMS --ignore-missing'
            echo "gh attestation verify lagom-$VERSION-<target>.tar.gz --repo $GITHUB_REPOSITORY"
            echo '```'
          } > dist/notes.md
          cat dist/notes.md
      - name: Keep the outputs of a manual run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            dist/SHA256SUMS
            dist/notes.md
      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          case "$VERSION" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" dist/lagom-*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "lagom $VERSION" --notes-file dist/notes.md "${pre[@]}"
