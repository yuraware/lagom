name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: python3 -I -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -I scripts/release_notes.py --check --base origin/${{ github.base_ref }}
        env:
          LAGOM_NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') && '1' || '0' }}

  latency:
    # Measures only; the regression gate comes with QA-08. macOS arm64 runners are scarce
    # (GitHub cancels jobs it can't place within 15 minutes), so pull requests measure on
    # Linux and pushes to main measure on both.
    strategy:
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-15
        with:
          toolchain: stable
      - run: sudo apt-get install -y hyperfine
        if: runner.os == 'Linux'
      - run: brew install hyperfine
        if: runner.os == 'macOS'
      - run: bench/latency.sh target/bench/latency-${{ matrix.os }}.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: latency-${{ matrix.os }}
          path: target/bench/latency-${{ matrix.os }}.json
