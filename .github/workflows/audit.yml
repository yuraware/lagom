name: audit

# SEC-07: checks Cargo.lock against the RustSec advisory database every night, so an
# advisory published after a merge shows up without waiting for the next pull request.
# Pull requests run the same check, with licenses and the crate allow-list, in ci.yml
# (QA-09). GitHub emails the repository's admins when a scheduled run fails.
on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
          command-arguments: advisories
          arguments: --all-features --locked
