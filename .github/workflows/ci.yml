name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 -I -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 -I scripts/release_notes.py --check --base origin/${{ github.base_ref }}
        env:
          LAGOM_NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') && '1' || '0' }}

  latency:
    # Measures only; the regression gate comes with QA-08.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get install -y hyperfine
        if: runner.os == 'Linux'
      - run: brew install hyperfine
        if: runner.os == 'macOS'
      - run: bench/latency.sh target/bench/latency-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: latency-${{ matrix.os }}
          path: target/bench/latency-${{ matrix.os }}.json

  fidelity:
    # BEN-04: no must_keep string may be lost, and total output may not grow >5% vs the base.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - name: No must_keep string lost
        run: ./target/release/lagom bench compress --json target/bench-current.json
      - name: Output size against the base branch
        # A deliberate trade (keeping more for fidelity) can be labelled `size-increase-ok`.
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'size-increase-ok')
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          cargo build --release --manifest-path ../base/Cargo.toml
          set +e
          ../base/target/release/lagom bench compress bench/corpus tests/fixtures/compress \
            --json target/bench-base.json > /dev/null
          code=$?
          set -e
          if [ "$code" -le 1 ] && [ -f target/bench-base.json ]; then
            ./target/release/lagom bench compress --compare target/bench-base.json --max-growth 5
          else
            echo "The base branch has no 'lagom bench compress' yet; skipping the size check."
          fi
